name: Release Flash Transfer

# Versioning automatique + build multi-plateforme, en UN SEUL run :
#
#   1. Job `version` : à chaque push sur `master` (ou via déclenchement manuel),
#      résout la version à publier :
#        - si la version courante (tauri.conf.json) n'a PAS encore de tag
#          (= elle vient d'être bumpée manuellement) → on la tague telle quelle ;
#        - sinon → on calcule la prochaine version (SemVer) depuis les messages
#          de commit (Conventional Commits), on bump les fichiers, on commit et tague.
#      Le tag est créé puis le job `build` enchaîne dans le même run — donc AUCUN
#      PAT n'est requis (on ne dépend pas du déclenchement croisé par un tag poussé
#      avec GITHUB_TOKEN, que GitHub n'autorise pas).
#
#   2. Job `build` : construit les binaires Windows / macOS (Intel + ARM) / Linux
#      et publie la release GitHub attachée au tag résolu.
#
# Pour sauter le versioning sur un commit : inclure `[skip version]` dans le message.
#
# Règles de bump : BREAKING CHANGE / `[major]` / `type!:` → major ;
#                  `feat:` / `[minor]` → minor ; sinon → patch.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Type de bump (auto = depuis les commits)'
        required: false
        default: 'auto'
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ── 1. Résolution / création de la version + tag ───────────────────────────
  version:
    # Évite la boucle : on ignore le commit de bump généré par ce workflow.
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !contains(github.event.head_commit.message, '[skip version]')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      do_build: ${{ steps.resolve.outputs.do_build }}
    steps:
      - name: Checkout (historique complet pour lire les tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Résoudre et taguer la version
        id: resolve
        run: |
          set -e
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          cur=$(node scripts/bump-version.mjs --print)

          if git rev-parse "v$cur" >/dev/null 2>&1; then
            # La version courante est déjà publiée → calcule la suivante.
            forced="${{ github.event.inputs.bump }}"
            if [ -n "$forced" ] && [ "$forced" != "auto" ]; then
              btype="$forced"
            else
              last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
              if [ -z "$last_tag" ]; then range="HEAD"; else range="${last_tag}..HEAD"; fi
              log=$(git log --format='%B' "$range" 2>/dev/null || echo "")
              if echo "$log" | grep -qiE 'BREAKING CHANGE|\[major\]|^[a-z]+!:'; then
                btype=major
              elif echo "$log" | grep -qiE '^feat(\(|:)|\[minor\]'; then
                btype=minor
              else
                btype=patch
              fi
            fi
            new=$(node scripts/bump-version.mjs "$btype")
            git add -A
            git commit -m "chore(release): v$new [skip version]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            # Version déjà bumpée (non encore taguée) → on la publie telle quelle.
            new="$cur"
          fi

          if git rev-parse "v$new" >/dev/null 2>&1; then
            echo "Le tag v$new existe déjà — pas de re-tag."
          else
            git tag -a "v$new" -m "Flash Transfer v$new"
            git push origin "v$new"
          fi
          echo "tag=v$new" >> "$GITHUB_OUTPUT"
          echo "do_build=true" >> "$GITHUB_OUTPUT"

  # ── 2. Build multi-plateforme + publication de la release ──────────────────
  build:
    needs: version
    if: needs.version.outputs.do_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macOS-Intel
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macOS-Apple-Silicon
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.name }}

    steps:
      - name: Checkout (tag résolu)
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}

      # ── Rust ───────────────────────────────────────────────────────────────
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── Node ───────────────────────────────────────────────────────────────
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node deps
        run: npm install

      # ── Fix icons → force RGBA PNG (requis par Tauri) ──────────────────────
      - name: Convert icons to RGBA
        shell: bash
        run: |
          # --break-system-packages nécessaire sur macOS avec Homebrew Python
          python3 -m pip install --quiet Pillow --break-system-packages \
            || python3 -m pip install --quiet Pillow
          python3 - <<'PYEOF'
          import os
          from PIL import Image
          icons_dir = "src-tauri/icons"
          for fname in os.listdir(icons_dir):
              if fname.endswith(".png"):
                  p = os.path.join(icons_dir, fname)
                  img = Image.open(p).convert("RGBA")
                  img.save(p, "PNG")
                  print(f"  RGBA ok: {fname}")
          PYEOF

      # ── Linux system deps ──────────────────────────────────────────────────
      - name: Linux system libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev

      # ── Build ──────────────────────────────────────────────────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: 'Flash⚡Transfer ${{ needs.version.outputs.tag }}'
          releaseBody: |
            ## 📥 Téléchargements

            | Plateforme | Fichier |
            |---|---|
            | Windows | `.msi` ou `.exe` |
            | macOS Intel | `.dmg` (x86_64) |
            | macOS Apple Silicon | `.dmg` (aarch64) |
            | Linux | `.AppImage` ou `.deb` |

            ## ⚠️ macOS — Avertissement Gatekeeper

            L'app n'est pas signée avec un certificat Apple. À la première ouverture, macOS peut afficher "impossible de vérifier le développeur".

            **Solution (2 options) :**

            **Option 1 — Clic droit :**
            > Clic droit sur le `.dmg` (ou sur `Flash Transfer.app`) → **Ouvrir** → confirmer dans la popup

            **Option 2 — Terminal** (après avoir glissé l'app dans `/Applications`) :
            ```sh
            xattr -dr com.apple.quarantine /Applications/Flash\ Transfer.app
            ```

            ## ✨ Nouveautés
            - Voir les commits pour le détail des changements

          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
