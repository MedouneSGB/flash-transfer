name: Auto Version & Tag

# Versioning automatique : à chaque push sur `master`, calcule la prochaine
# version (SemVer) à partir des messages de commit, met à jour tous les
# fichiers de version, commit le bump et pousse un tag `vX.Y.Z`.
# Le tag déclenche ensuite `release.yml` qui construit et publie les binaires.
#
# Règles de bump (Conventional Commits) sur les commits depuis le dernier tag :
#   - BREAKING CHANGE / `feat!:` / `[major]`  -> major
#   - `feat:` / `[minor]`                      -> minor
#   - tout le reste (fix, chore, ...)          -> patch
#
# Pour sauter le versioning sur un commit : inclure `[skip version]` dans le message.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: 'Type de bump forcé'
        required: false
        default: 'auto'
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write

concurrency:
  group: auto-version
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    # Évite la boucle infinie : on ignore le commit de bump généré par ce workflow.
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(release):') &&
      !contains(github.event.head_commit.message, '[skip version]')
    steps:
      - name: Checkout (historique complet pour lire les tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Un PAT permet au tag poussé de déclencher release.yml.
          # Sans PAT, on retombe sur GITHUB_TOKEN (tag créé, build à lancer via workflow_dispatch).
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Déterminer le type de bump
        id: bump
        run: |
          forced="${{ github.event.inputs.bump }}"
          if [ -n "$forced" ] && [ "$forced" != "auto" ]; then
            echo "type=$forced" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$last_tag" ]; then
            range="HEAD"
          else
            range="${last_tag}..HEAD"
          fi
          log=$(git log --format='%B' "$range" 2>/dev/null || echo "")
          if echo "$log" | grep -qiE 'BREAKING CHANGE|\[major\]|^feat!:|^[a-z]+!:'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$log" | grep -qiE '^feat(\(|:)|\[minor\]'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump des fichiers de version
        id: ver
        run: |
          new=$(node scripts/bump-version.mjs "${{ steps.bump.outputs.type }}")
          echo "version=$new" >> "$GITHUB_OUTPUT"

      - name: Commit, tag et push
        env:
          NEW: ${{ steps.ver.outputs.version }}
        run: |
          if git rev-parse "v$NEW" >/dev/null 2>&1; then
            echo "Le tag v$NEW existe déjà — abandon."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "chore(release): v$NEW [skip version]"
          git tag -a "v$NEW" -m "Flash Transfer v$NEW"
          git push origin HEAD:master
          git push origin "v$NEW"
